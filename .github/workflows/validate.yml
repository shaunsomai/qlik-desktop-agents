name: Validate and package
on: [push, pull_request, workflow_dispatch]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/collect-qlik-dev.py --validate-only
      - run: python scripts/package.py
      - name: Install Claude Code test runtime
        run: curl -fsSL https://claude.ai/install.sh | bash -s -- 2.1.274
      - run: python scripts/test-installation.py
        env:
          CLAUDE_TEST_BINARY: /home/runner/.local/bin/claude
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-package
          path: dist/*
